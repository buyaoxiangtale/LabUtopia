# Parquet格式数据收集配置示例
name: level5_Navigation_parquet

task_type: "navigation_task_test_weizi"
controller_type: "navigation_parquet"  # 使用支持Parquet格式相机数据收集的控制器
mode: "collect"

# USD 场景文件
usd_path: "roomlayout/layout_new/Alkylation_of_Ethyl_Acetoacetate_with_Bis_4-fluoro_20251229_003726/Alkylation_of_Ethyl_Acetoacetate_with_Bis_4-fluoro_room_isaacsim.usd"

# 最大 episode 数量
max_episodes: 100

# ==================== 推断配置 ====================
infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

# ==================== 任务配置 ====================
task:
  max_steps: 4000
  navigation_config_path: "config/navigation/navigation_assets_1_4.yaml"
  goal_pairs:
    - start: [2.2, 7.11, 0.0]
      end: [5.5, 6.26, 0.0]
    - start: [5.5, 6.26, 0.0]
      end: [6.485, 4.5, 4.71238898038469]
    - start: [6.485, 4.5, 4.71238898038469]
      end: [5.507, 1.8, 4.71238898038469]
  max_linear_speed: 0.6
  max_angular_speed: 1.5
  position_threshold: 0.08
  angle_threshold: 0.1

# ==================== 相机配置 ====================
cameras:
  - prim_path: "/World/Ridgebase/base_link/Camera_02"
    name: "observation"
    resolution: [256, 256]
    image_type: "rgb+depth"  # 同时收集 RGB 和深度图
    clipping_range: [0.1, 10.0]

  # 如果需要多个相机，可以添加更多
  # - prim_path: "/World/Ridgebase/base_link/Camera_02"
  #   name: "wrist"
  #   resolution: [256, 256]
  #   image_type: "rgb"

# ==================== 机器人配置 ====================
robot:
  type: "ridgebase"
  position: [0.0, 0.0, 0.0]

# ==================== 数据集配置 ====================
dataset:
  type: "parquet_format"  # 使用 Parquet 格式收集器
  chunk_size: 1000        # 每个 chunk 包含的 episode 数量

  # 是否同时保存视频和图像
  save_videos: true       # 同时保存 MP4 视频
  save_images: true       # 保存单帧图像（JPG/PNG）

  # 视频编码配置（如果 save_videos=true）
  video:
    # RGB 视频配置
    rgb_codec: "mp4v"
    rgb_fps: 30

    # 深度视频配置
    depth_codec: "mp4v"
    depth_fps: 30
    depth_colormap: "jet"  # jet/viridis/gray

  # 图像编码配置（如果 save_images=true）
  image:
    # RGB 图像配置
    rgb_format: "jpg"      # jpg 或 png
    rgb_quality: 95        # JPEG 质量 (1-100)

    # 深度图配置
    depth_format: "png"    # png (无损)
    depth_normalize: true  # 归一化到 0-255
    depth_colormap: "jet"  # jet/viridis/gray (用于可视化)

# ==================== 收集器配置 ====================
collector:
  type: "parquet_format"  # 指定使用 Parquet 格式收集器

# ==================== 多轮运行配置 ====================
multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
